<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SHAHEE Admin</title>
<style>body{font-family:system-ui;background:#070b07;color:#f3ecd8;margin:0;padding:20px}h1,h2{color:#d9b25f}input,select,button{padding:9px;margin:4px 0;background:#000;color:#f3ecd8;border:1px solid #d9b25f66;border-radius:6px;font:inherit}button{cursor:pointer;background:#d9b25f;color:#1a1205;font-weight:700}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #d9b25f33;text-align:left;vertical-align:top}.g{display:flex;flex-wrap:wrap;gap:10px}.g div{width:140px;font-size:12px}.g img{width:140px;height:140px;object-fit:cover;border-radius:8px}#app{display:none;max-width:1000px;margin:auto;overflow-x:auto}#lg{max-width:320px;margin:15vh auto}</style></head><body>
<div id="lg"><h1>SHAHEE Admin</h1><input id="pw" type="password" placeholder="Password" style="width:100%"><button id="go" style="width:100%">Login</button><p id="er"></p></div>
<div id="app"><h1>Orders</h1><table><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="ob"></tbody></table>
<h2>Instagram / Gallery</h2><div><input id="iu" placeholder="https://image-url" size="40"> <input id="ic" placeholder="Caption"> <input id="il" placeholder="Post link (optional)"> <button id="ia">Add</button></div><div class="g" id="gl"></div></div>
<script>
let T=sessionStorage.getItem('t');const $=s=>document.querySelector(s);
const api=(p,o={})=>fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T}}).then(r=>{if(r.status===401){sessionStorage.removeItem('t');location.reload()}return r.json()});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function load(){$('#lg').style.display='none';$('#app').style.display='block';
const o=await api('/api/admin/orders');$('#ob').innerHTML=o.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString()}</td><td>${esc(x.name)}<br>${esc(x.phone)}<br>${esc(x.address)}</td><td>${x.items.map(i=>i.s+' ml × '+i.q).join('<br>')}</td><td>₹${x.total}</td><td>${esc(x.payment)}</td><td><select data-id="${x._id}">${['New','Confirmed','Shipped','Delivered','Cancelled','Pending payment'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');
document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>api('/api/admin/orders/'+s.dataset.id,{method:'PATCH',body:JSON.stringify({status:s.value})}));
const g=await fetch('/api/gallery').then(r=>r.json());$('#gl').innerHTML=g.map(x=>`<div><img src="${esc(x.imageUrl)}" alt=""><br>${esc(x.caption)}<br><button data-d="${x._id}">Delete</button></div>`).join('');
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await api('/api/admin/gallery/'+b.dataset.d,{method:'DELETE'});load()})}
$('#go').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})}).then(r=>r.json());if(r.token){T=r.token;sessionStorage.setItem('t',T);load()}else $('#er').textContent=r.error};
$('#ia').onclick=async()=>{const r=await api('/api/admin/gallery',{method:'POST',body:JSON.stringify({imageUrl:$('#iu').value,caption:$('#ic').value,link:$('#il').value})});if(r.error)alert(r.error);else{$('#iu').value='';load()}};
if(T)load();</script></body></html>
